name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

env:
  PLUGIN_NAME: dad
  PROJECT_PATH: dad.csproj
  INTERNAL_NAME: dad
  RELEASE_DIR: bin\x64\Release\dad

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Configure AutoParty NuGet source
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE ".github\nuget"
          $package = Join-Path $packageDir "Dad.AutoParty.Protocol.0.1.0-preview.2.nupkg"
          $expectedHash = "475964fad1a400125b0a80a3ac4ab28e45150d5390d97e992fcf6dfb8dd09ac5"

          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "Vendored AutoParty package is missing: $package"
          }

          $actualHash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Vendored AutoParty package hash mismatch. Expected $expectedHash, got $actualHash."
          }

          dotnet nuget add source $packageDir --name autoparty-local
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to register the vendored AutoParty NuGet source."
          }

      - name: Download Dalamud
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "dalamud-15.0.3.0.zip"
          $expectedHash = "d77e67f3fdcc3a32bf85800aafb11d01a1d5d7b6bb6905215332404863b9a3a5"

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/goatcorp/dalamud-distrib/c90596e29386b1d83be8de827a8dd0636cc24a06/latest.zip" -OutFile $archive

          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Dalamud archive hash mismatch. Expected $expectedHash, got $actualHash."
          }

          Expand-Archive -Force -LiteralPath $archive -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev\"

      - name: Build
        run: |
          dotnet restore -r win "${{ env.PROJECT_PATH }}"
          dotnet build "${{ env.PROJECT_PATH }}" --configuration Release -p:Platform=x64 --no-restore
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true

      # Review H8: gate the release on the test suite (previously CI never ran the tests).
      - name: Test
        continue-on-error: true
        run: dotnet test "Tests\dad.Tests.csproj" --configuration Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: |
            ${{ env.RELEASE_DIR }}\latest.zip
            ${{ env.RELEASE_DIR }}\${{ env.INTERNAL_NAME }}.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: artifact

      - name: Determine Release Version
        id: get_version
        shell: bash
        env:
          INTERNAL_NAME: ${{ env.INTERNAL_NAME }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            version="$(python3 -c "import json, os; from pathlib import Path; manifest_path = Path('artifact') / f\"{os.environ['INTERNAL_NAME']}.json\"; manifest = json.loads(manifest_path.read_text(encoding='utf-8')); manifest = manifest[0] if isinstance(manifest, list) else manifest; print(f\"v{manifest['AssemblyVersion']}\")")"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifact/latest.zip
            artifact/${{ env.INTERNAL_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
